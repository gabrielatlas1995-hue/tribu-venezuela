<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos los Productos - TribuArte</title>
    <meta name="description" content="Explora todas las artesanías latinoamericanas disponibles en TribuArte.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="../index.html" class="logo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg> Tribu</a>
            <nav class="nav"><ul><li><a href="productos.html">Productos</a></li><li><a href="registro-vendedor.html">Vender</a></li><li><a href="faq.html">FAQ</a></li><li><a href="contacto.html">Contacto</a></li></ul></nav>
            <div class="header-actions">
                <button class="cart-btn" onclick="openCartSidebar()" aria-label="Carrito"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="cart-count" style="display:none;">0</span></button>
                <button class="menu-toggle" aria-label="Menú"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
            </div>
        </div>
    </header>

    <section class="page-hero">
        <div class="container">
            <h1>Todos los Productos</h1>
            <p>Artesanías únicas hechas a mano por creadores latinoamericanos</p>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div style="display:flex;gap:0.75rem;flex-wrap:wrap;justify-content:center;margin-bottom:2rem;" id="category-filters"></div>
            <div class="product-grid" id="all-products"></div>
        </div>
    </section>

    <footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2025-2026 TribuArte.</p></div></div></footer>
    <div id="cart-sidebar" class="cart-sidebar"></div>
    <div id="cart-backdrop" class="cart-backdrop" onclick="closeCartSidebar()"></div>
    <div id="toast-container" class="toast-container"></div>

    <script src="../js/data.js"></script>
    <script src="../js/app.js"></script>
    <script>
        // Category filter
        const filters = document.getElementById('category-filters');
        const urlCat = new URLSearchParams(window.location.search).get('cat');
        let activeCat = urlCat || 'all';

        function renderFiltered(cat) {
            activeCat = cat;
            const products = cat === 'all' ? PRODUCTOS : getProductsByCategory(cat);
            renderProducts('all-products', products, '../');

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.cat === cat);
            });
        }

        if (filters) {
            const cats = [{slug: 'all', name: 'Todos'}, ...CATEGORIAS];
            filters.innerHTML = cats.map(c =>
                `<button class="btn ${c.slug === activeCat ? 'btn-primary' : 'btn-outline'} btn-small filter-btn" data-cat="${c.slug}" onclick="renderFiltered('${c.slug}')">${c.name}</button>`
            ).join('');
        }

        document.addEventListener('DOMContentLoaded', () => renderFiltered(activeCat));
    </script>
</body>
</html>
