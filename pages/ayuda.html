<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Ayuda — Tribu</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>.page-header{background:var(--color-gray-100);padding:var(--space-12) 0;text-align:center}.page-header h1{font-family:var(--font-display);font-size:var(--text-4xl);color:var(--color-gray-900)}.content{padding:var(--space-16) 0;max-width:800px;margin:0 auto}.help-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-4);margin:var(--space-8) 0}.help-card{padding:var(--space-6);background:var(--color-gray-50);border-radius:var(--radius-lg);text-align:center;transition:all var(--transition-fast)}.help-card:hover{background:var(--color-primary-bg)}.help-card i{font-size:var(--text-3xl);color:var(--color-primary);margin-bottom:var(--space-3)}.help-card h3{font-family:var(--font-display);font-size:var(--text-lg);margin-bottom:var(--space-2)}.help-card p{font-size:var(--text-sm);color:var(--color-gray-500)}.back-link{display:inline-flex;align-items:center;gap:var(--space-2);color:var(--color-primary);margin-top:var(--space-8)}@media(max-width:767px){.help-grid{grid-template-columns:1fr}}</style>
</head>
<body>
    <div class="top-bar"><div class="container"><span>🚚 Envíos a toda Venezuela</span></div></div>
    <header class="header"><div class="container"><div class="header-content"><a href="/" class="logo"><i class="fas fa-users"></i><span>Tribu</span></a></div></div></header>
    <section class="page-header"><div class="container"><h1>Centro de Ayuda</h1></div></section>
    <section class="content">
        <div class="container">
            <div class="help-grid">
                <a href="/pages/faq.html" class="help-card">
                    <i class="fas fa-question-circle"></i>
                    <h3>Preguntas Frecuentes</h3>
                    <p>Respuestas a las dudas más comunes</p>
                </a>
                <a href="/pages/envios-devoluciones.html" class="help-card">
                    <i class="fas fa-shipping-fast"></i>
                    <h3>Envíos</h3>
                    <p>Tiempos, costos y seguimiento</p>
                </a>
                <a href="/pages/contacto.html" class="help-card">
                    <i class="fas fa-headset"></i>
                    <h3>Contactar Soporte</h3>
                    <p>WhatsApp, email y redes sociales</p>
                </a>
                <a href="/pages/registro-artesano.html" class="help-card">
                    <i class="fas fa-store"></i>
                    <h3>Vender en Tribu</h3>
                    <p>Cómo empezar como artesano</p>
                </a>
            </div>
            <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
        </div>
    </section>
    <footer class="footer"><div class="container"><p class="copyright" style="text-align:center">© 2024-2025 Tribu</p></div></footer>
</body>
</html>
