<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda del Artesano - TribuArte</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header"><div class="container"><a href="index.html" class="logo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg> Tribu</a><nav class="nav"><ul><li><a href="pages/productos.html">Productos</a></li><li><a href="pages/registro-vendedor.html">Vender</a></li><li><a href="pages/faq.html">FAQ</a></li><li><a href="pages/contacto.html">Contacto</a></li></ul></nav><div class="header-actions"><button class="cart-btn" onclick="openCartSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span class="cart-count" style="display:none;">0</span></button><button class="menu-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button></div></div></header>

    <nav class="breadcrumb"><div class="container"><a href="index.html">Inicio</a> <span>/</span> <span id="breadcrumb-name">Artesano</span></div></nav>

    <main class="section">
        <div class="container">
            <div id="artisan-profile" style="margin-bottom:3rem;"></div>
            <h2 class="section-title" style="text-align:left;">Productos</h2>
            <p id="products-count" style="color:var(--color-gray-500);margin-bottom:1.5rem;"></p>
            <div id="artisan-products" class="product-grid"></div>
        </div>
    </main>

    <footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2025-2026 TribuArte.</p></div></div></footer>
    <div id="cart-sidebar" class="cart-sidebar"></div>
    <div id="cart-backdrop" class="cart-backdrop" onclick="closeCartSidebar()"></div>
    <div id="toast-container" class="toast-container"></div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        const artisanId = new URLSearchParams(window.location.search).get('id');
        function loadArtisan() {
            if (!artisanId) { window.location.href = 'index.html'; return; }
            const artisan = getArtisanById(artisanId);
            if (!artisan) { window.location.href = 'index.html'; return; }
            document.title = artisan.name + ' - TribuArte';
            document.getElementById('breadcrumb-name').textContent = artisan.name;
            const products = getProductsByArtisan(artisanId);
            document.getElementById('artisan-profile').innerHTML =
                '<div class="artisan-detail-card"><div class="artisan-avatar-large"><img src="' + artisan.avatar + '" alt="' + artisan.name + '"></div><div class="artisan-info"><h1 style="font-family:var(--font-display);font-size:var(--text-3xl);margin-bottom:0.25rem;">' + artisan.name + '</h1><div class="artisan-brand" style="font-size:var(--text-base);margin-bottom:0.25rem;">' + artisan.brand + '</div><p class="artisan-location" style="margin-bottom:0.75rem;">📍 ' + artisan.location + '</p><p class="artisan-bio">' + artisan.bio + '</p><div style="display:flex;gap:2rem;margin-top:1rem;"><div><strong style="color:var(--color-gold);">★ ' + artisan.rating + '</strong> <span style="color:var(--color-gray-500);font-size:var(--text-sm);">rating</span></div><div><strong>' + artisan.sales + '</strong> <span style="color:var(--color-gray-500);font-size:var(--text-sm);">ventas</span></div><div><strong>' + products.length + '</strong> <span style="color:var(--color-gray-500);font-size:var(--text-sm);">productos</span></div></div></div></div>';
            document.getElementById('products-count').textContent = products.length + ' producto' + (products.length !== 1 ? 's' : '') + ' disponible' + (products.length !== 1 ? 's' : '');
            renderProducts('artisan-products', products);
        }
        document.addEventListener('DOMContentLoaded', loadArtisan);
    </script>
</body>
</html>
